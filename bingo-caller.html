
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bingo Ball Caller</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212f;
      --muted: #637083;
      --line: #d9e0ea;
      --paper: #fbfcfe;
      --panel: #ffffff;
      --brand: #0f766e;
      --brand-dark: #0b5d57;
      --gold: #f5b642;
      --red: #d94b4b;
      --blue: #2f6fca;
      --green: #248a55;
      --shadow: 0 18px 45px rgba(23, 33, 47, 0.12);
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.08), transparent 38%),
        linear-gradient(45deg, rgba(245, 182, 66, 0.13), transparent 32%),
        #eef3f7;
      color: var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: clamp(12px, 3vw, 24px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3.6vw, 4rem);
      letter-spacing: 0;
      line-height: 1;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .top-count {
      min-width: 190px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .top-count strong {
      display: block;
      font-size: 2.2rem;
      line-height: 1;
    }

    .top-count span {
      color: var(--muted);
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    main {
      display: grid;
      grid-template-columns: minmax(310px, 420px) minmax(620px, 1fr);
      gap: 20px;
      align-items: start;
    }

    main > * {
      min-width: 0;
    }

    .caller,
    .board-wrap,
    .history {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .caller {
      padding: 20px;
      display: grid;
      gap: 18px;
    }

    .current-ball {
      min-height: 260px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: radial-gradient(circle at 34% 24%, #ffffff 0 16%, #f4f7fb 17% 24%, #e7eef6 25% 100%);
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .current-ball::after {
      content: "";
      position: absolute;
      width: 54%;
      height: 54%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.48);
      top: 8%;
      left: 11%;
      filter: blur(3px);
    }

    .ball-face {
      position: relative;
      z-index: 1;
      width: min(210px, 70vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffffff;
      border: 12px solid var(--brand);
      display: grid;
      place-items: center;
      box-shadow: inset -16px -18px 28px rgba(23, 33, 47, 0.12), 0 16px 30px rgba(23, 33, 47, 0.18);
    }

    .ball-label {
      display: grid;
      text-align: center;
      line-height: 0.92;
    }

    .ball-letter {
      color: var(--brand);
      font-size: 3.4rem;
      font-weight: 900;
    }

    .ball-number {
      font-size: 4.2rem;
      font-weight: 900;
    }

    .placeholder {
      color: var(--muted);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .status {
      min-height: 52px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #eef9f7;
      border: 1px solid #b7ded8;
      color: #0b5d57;
      font-weight: 700;
      display: flex;
      align-items: center;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .speed-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }

    .speed-row input {
      width: 100%;
      accent-color: var(--brand);
    }

    .btn {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
      color: white;
      background: var(--brand);
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: var(--brand-dark);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .btn.secondary {
      background: #2f6fca;
    }

    .btn.secondary:hover {
      background: #255aa5;
    }

    .btn.warning {
      background: #d47b23;
    }

    .btn.warning:hover {
      background: #ad6218;
    }

    .btn.danger {
      background: var(--red);
    }

    .btn.danger:hover {
      background: #b93b3b;
    }

    .btn.wide {
      grid-column: 1 / -1;
    }

    .board-wrap {
      padding: 16px;
      overflow: auto;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(64px, 1fr));
      gap: 6px;
      min-width: 380px;
    }

    .board-header,
    .cell {
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      font-weight: 900;
    }

    .board-header {
      color: white;
      font-size: 1.3rem;
    }

    .board-header.b { background: #d94b4b; }
    .board-header.i { background: #2f6fca; }
    .board-header.n { background: #8b5fbf; }
    .board-header.g { background: #248a55; }
    .board-header.o { background: #d47b23; }

    .cell {
      border: 1px solid var(--line);
      background: #f7f9fc;
      color: #7c8795;
      font-size: 1rem;
      transition: background 0.16s ease, color 0.16s ease, border 0.16s ease, transform 0.16s ease;
    }

    .cell.called {
      background: var(--ink);
      border-color: var(--ink);
      color: white;
      transform: scale(0.98);
    }

    .cell.latest {
      background: var(--gold);
      border-color: #c38316;
      color: #241800;
      outline: 3px solid rgba(245, 182, 66, 0.35);
    }

    .history {
      padding: 16px;
      margin-top: 20px;
    }

    .history h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
    }

    .history-list {
      min-height: 92px;
      max-height: 180px;
      overflow: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
    }

    .chip {
      border-radius: 999px;
      background: #edf2f7;
      border: 1px solid var(--line);
      padding: 7px 10px;
      min-width: 54px;
      text-align: center;
      font-weight: 800;
    }

    .chip:first-child {
      background: var(--gold);
      border-color: #c38316;
    }

    .empty-history {
      color: var(--muted);
      padding-top: 8px;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(8, 14, 22, 0.52);
      z-index: 5;
    }

    .modal.open {
      display: grid;
    }

    .dialog {
      width: min(460px, 100%);
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
      border: 1px solid var(--line);
    }

    .dialog h2 {
      margin: 0 0 10px;
      font-size: 1.8rem;
    }

    .dialog p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    .dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 980px) {
      header,
      main {
        grid-template-columns: 1fr;
      }

      header {
        display: grid;
      }

      .top-count {
        min-width: 0;
      }

      .board { min-width: 380px; }
    }

    @media (max-width: 620px) {
      header {
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 2.05rem;
      }

      .subtitle {
        font-size: 0.92rem;
        line-height: 1.35;
      }

      .top-count {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 12px;
        box-shadow: 0 8px 20px rgba(23, 33, 47, 0.09);
      }

      .top-count strong {
        font-size: 1.65rem;
      }

      .top-count span {
        font-size: 0.75rem;
      }

      main {
        gap: 12px;
      }

      .caller,
      .board-wrap,
      .history {
        box-shadow: 0 8px 20px rgba(23, 33, 47, 0.09);
      }

      .caller {
        gap: 12px;
        padding: 12px;
      }

      .current-ball {
        min-height: 176px;
      }

      .ball-face {
        width: min(158px, 54vw);
        border-width: 9px;
      }

      .ball-letter {
        font-size: 2.45rem;
      }

      .ball-number {
        font-size: 3.05rem;
      }

      .status {
        min-height: 44px;
        padding: 10px 12px;
        font-size: 0.92rem;
        line-height: 1.35;
      }

      .speed-row {
        gap: 8px;
        font-size: 0.9rem;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .btn {
        min-height: 46px;
        padding: 9px 8px;
        font-size: 0.9rem;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .board-wrap {
        padding: 10px;
        overflow: visible;
      }

      .board {
        min-width: 0;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 4px;
      }

      .board-header,
      .cell {
        height: clamp(34px, 10.6vw, 42px);
        border-radius: 5px;
      }

      .board-header {
        font-size: 1.05rem;
      }

      .cell {
        font-size: 0.92rem;
      }

      .cell.latest {
        outline-width: 2px;
      }

      .history {
        margin-top: 12px;
        padding: 12px;
      }

      .history h2 {
        font-size: 1rem;
      }

      .history-list {
        min-height: 72px;
        max-height: 150px;
        gap: 6px;
      }

      .chip {
        min-width: 48px;
        padding: 6px 8px;
        font-size: 0.88rem;
      }

      .modal {
        padding: 12px;
      }

      .dialog {
        padding: 18px;
      }

      .dialog h2 {
        font-size: 1.45rem;
      }

      .dialog-actions {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    @media (max-width: 380px) {
      .app {
        padding: 8px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .btn.wide {
        grid-column: auto;
      }

      .board-header,
      .cell {
        height: 32px;
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Bingo Caller</h1>
        <p class="subtitle">Automatically calls balls, tracks the board, and pauses when Bingo is called.</p>
      </div>
      <div class="top-count" aria-live="polite">
        <strong id="calledCount">0</strong>
        <span>of 75 called</span>
      </div>
    </header>

    <main>
      <section class="caller" aria-label="Bingo caller controls">
        <div class="current-ball" aria-live="polite">
          <div class="ball-face" id="ballFace">
            <div class="placeholder">Ready</div>
          </div>
        </div>

        <div class="status" id="status">Press Start Auto Call or Call Next Ball to begin.</div>

        <div class="speed-row">
          <label for="speed">Auto call speed</label>
          <strong id="speedLabel">5s</strong>
          <input id="speed" type="range" min="2" max="12" step="1" value="5">
        </div>

        <div class="controls">
          <button class="btn" id="autoBtn" type="button">Start Auto Call</button>
          <button class="btn secondary" id="nextBtn" type="button">Call Next Ball</button>
          <button class="btn warning wide" id="bingoBtn" type="button" disabled>Bingo Called</button>
          <button class="btn danger" id="resetBtn" type="button">Reset Game</button>
          <button class="btn secondary" id="undoBtn" type="button" disabled>Undo Last</button>
        </div>
      </section>

      <div>
        <section class="board-wrap" aria-label="Called bingo balls board">
          <div class="board" id="board"></div>
        </section>

        <section class="history" aria-label="Called bingo balls history">
          <h2>Call History</h2>
          <div class="history-list" id="historyList">
            <div class="empty-history">No balls have been called yet.</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal" id="bingoModal" role="dialog" aria-modal="true" aria-labelledby="bingoTitle">
    <div class="dialog">
      <h2 id="bingoTitle">Verify Bingo</h2>
      <p id="bingoMessage">The game is paused while the Bingo is verified.</p>
      <div class="dialog-actions">
        <button class="btn" id="endGame" type="button">End Game</button>
        <button class="btn secondary" id="continueGame" type="button">Continue Game</button>
      </div>
    </div>
  </div>

  <script>
    const columns = [
      { letter: "B", start: 1, end: 15, className: "b" },
      { letter: "I", start: 16, end: 30, className: "i" },
      { letter: "N", start: 31, end: 45, className: "n" },
      { letter: "G", start: 46, end: 60, className: "g" },
      { letter: "O", start: 61, end: 75, className: "o" }
    ];

    const state = {
      remaining: [],
      called: [],
      autoRunning: false,
      bingoPaused: false,
      resumeAfterCheck: false,
      gameOver: false,
      timer: null
    };

    const board = document.getElementById("board");
    const ballFace = document.getElementById("ballFace");
    const status = document.getElementById("status");
    const calledCount = document.getElementById("calledCount");
    const historyList = document.getElementById("historyList");
    const autoBtn = document.getElementById("autoBtn");
    const nextBtn = document.getElementById("nextBtn");
    const bingoBtn = document.getElementById("bingoBtn");
    const resetBtn = document.getElementById("resetBtn");
    const undoBtn = document.getElementById("undoBtn");
    const speed = document.getElementById("speed");
    const speedLabel = document.getElementById("speedLabel");
    const bingoModal = document.getElementById("bingoModal");
    const bingoMessage = document.getElementById("bingoMessage");
    const endGame = document.getElementById("endGame");
    const continueGame = document.getElementById("continueGame");

    function getLetter(number) {
      return columns.find((column) => number >= column.start && number <= column.end).letter;
    }

    function ballName(number) {
      return `${getLetter(number)}-${number}`;
    }

    function buildBoard() {
      board.innerHTML = "";

      columns.forEach((column) => {
        const header = document.createElement("div");
        header.className = `board-header ${column.className}`;
        header.textContent = column.letter;
        board.appendChild(header);
      });

      for (let row = 0; row < 15; row += 1) {
        columns.forEach((column) => {
          const number = column.start + row;
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.id = `ball-${number}`;
          cell.textContent = number;
          cell.setAttribute("aria-label", `${ballName(number)} not called`);
          board.appendChild(cell);
        });
      }
    }

    function freshBalls() {
      return Array.from({ length: 75 }, (_, index) => index + 1);
    }

    function setBallDisplay(number) {
      if (!number) {
        ballFace.innerHTML = '<div class="placeholder">Ready</div>';
        return;
      }

      ballFace.innerHTML = `
        <div class="ball-label">
          <span class="ball-letter">${getLetter(number)}</span>
          <span class="ball-number">${number}</span>
        </div>
      `;
    }

    function updateBoard() {
      document.querySelectorAll(".cell").forEach((cell) => {
        cell.classList.remove("called", "latest");
        const number = Number(cell.id.replace("ball-", ""));
        cell.setAttribute("aria-label", `${ballName(number)} not called`);
      });

      state.called.forEach((number) => {
        const cell = document.getElementById(`ball-${number}`);
        if (cell) {
          cell.classList.add("called");
          cell.setAttribute("aria-label", `${ballName(number)} called`);
        }
      });

      const latest = state.called.at(-1);
      if (latest) {
        document.getElementById(`ball-${latest}`)?.classList.add("latest");
      }
    }

    function updateHistory() {
      if (state.called.length === 0) {
        historyList.innerHTML = '<div class="empty-history">No balls have been called yet.</div>';
        return;
      }

      historyList.innerHTML = "";
      [...state.called].reverse().forEach((number) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = ballName(number);
        historyList.appendChild(chip);
      });
    }

    function refreshUi() {
      const latest = state.called.at(-1);
      calledCount.textContent = state.called.length;
      setBallDisplay(latest);
      updateBoard();
      updateHistory();

      undoBtn.disabled = state.called.length === 0 || state.bingoPaused || state.gameOver;
      nextBtn.disabled = state.bingoPaused || state.gameOver || state.remaining.length === 0;
      autoBtn.disabled = state.bingoPaused || state.gameOver || state.remaining.length === 0;
      bingoBtn.disabled = state.called.length === 0 || state.bingoPaused || state.gameOver;
      autoBtn.textContent = state.autoRunning ? "Pause Auto Call" : "Start Auto Call";
      speedLabel.textContent = `${speed.value}s`;

      if (state.remaining.length === 0 && !state.bingoPaused && !state.gameOver) {
        status.textContent = "All 75 bingo balls have been called.";
      }
    }

    function stopAuto() {
      state.autoRunning = false;
      clearTimeout(state.timer);
      state.timer = null;
      refreshUi();
    }

    function scheduleAutoCall() {
      clearTimeout(state.timer);
      if (!state.autoRunning || state.bingoPaused || state.gameOver || state.remaining.length === 0) {
        return;
      }

      state.timer = setTimeout(() => {
        callNextBall(true);
      }, Number(speed.value) * 1000);
    }

    function openBingoCheck() {
      const latest = state.called.at(-1);
      state.resumeAfterCheck = state.autoRunning;
      state.bingoPaused = true;
      state.autoRunning = false;
      clearTimeout(state.timer);
      bingoMessage.textContent = `The game is paused at ${state.called.length} called balls. Last ball: ${ballName(latest)}.`;
      bingoModal.classList.add("open");
      continueGame.focus();
      refreshUi();
    }

    function callNextBall(fromAuto = false) {
      if (state.bingoPaused || state.gameOver || state.remaining.length === 0) {
        return;
      }

      const index = Math.floor(Math.random() * state.remaining.length);
      const [number] = state.remaining.splice(index, 1);
      state.called.push(number);
      status.textContent = `${ballName(number)} called.`;
      refreshUi();
      if (fromAuto && state.remaining.length > 0) {
        scheduleAutoCall();
      }
    }

    function closeBingoCheck(endTheGame) {
      const latest = state.called.at(-1);
      bingoModal.classList.remove("open");
      state.bingoPaused = false;

      if (endTheGame) {
        state.autoRunning = false;
        state.resumeAfterCheck = false;
        state.gameOver = true;
        status.textContent = `Game ended after Bingo was verified at ${state.called.length} balls. Last ball: ${ballName(latest)}.`;
        refreshUi();
        return;
      }

      if (state.remaining.length === 0) {
        state.autoRunning = false;
        state.resumeAfterCheck = false;
        status.textContent = "Bingo check closed. All 75 bingo balls have been called.";
        refreshUi();
        return;
      }

      status.textContent = "Bingo check closed. Ready for the next ball.";
      if (state.resumeAfterCheck) {
        state.autoRunning = true;
      }
      state.resumeAfterCheck = false;
      refreshUi();
      scheduleAutoCall();
    }

    function resetGame() {
      clearTimeout(state.timer);
      state.remaining = freshBalls();
      state.called = [];
      state.autoRunning = false;
      state.bingoPaused = false;
      state.resumeAfterCheck = false;
      state.gameOver = false;
      bingoModal.classList.remove("open");
      status.textContent = "Press Start Auto Call or Call Next Ball to begin.";
      refreshUi();
    }

    function undoLast() {
      if (state.called.length === 0 || state.bingoPaused || state.gameOver) {
        return;
      }

      const number = state.called.pop();
      state.remaining.push(number);
      status.textContent = `${ballName(number)} was removed.`;
      refreshUi();
    }

    autoBtn.addEventListener("click", () => {
      if (state.autoRunning) {
        stopAuto();
        status.textContent = "Auto calling paused.";
        return;
      }

      state.autoRunning = true;
      status.textContent = "Auto calling started.";
      refreshUi();
      callNextBall(true);
    });

    nextBtn.addEventListener("click", () => {
      stopAuto();
      callNextBall(false);
    });

    resetBtn.addEventListener("click", resetGame);
    undoBtn.addEventListener("click", undoLast);
    bingoBtn.addEventListener("click", openBingoCheck);
    endGame.addEventListener("click", () => closeBingoCheck(true));
    continueGame.addEventListener("click", () => closeBingoCheck(false));

    speed.addEventListener("input", () => {
      refreshUi();
      scheduleAutoCall();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.bingoPaused) {
        closeBingoCheck(false);
      }
    });

    buildBoard();
    resetGame();
  </script>
</body>
</html>
