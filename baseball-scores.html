<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live MLB GameCenter</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667187;
      --line: #d9e2ee;
      --panel: #ffffff;
      --soft: #f4f8fb;
      --navy: #1e3a5f;
      --blue: #2f6fca;
      --red: #c33b34;
      --gold: #d69b2d;
      --green: #12805c;
      --shadow: 0 18px 48px rgba(23, 32, 51, 0.13);
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(135deg, rgba(47, 111, 202, 0.14), transparent 34%),
        linear-gradient(45deg, rgba(195, 59, 52, 0.12), transparent 28%),
        #edf3f8;
      color: var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .app {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: clamp(12px, 3vw, 24px);
    }

    header {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 4vw, 4.5rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.45;
    }

    .controls {
      display: grid;
      grid-template-columns: auto minmax(168px, 1fr) auto;
      gap: 8px;
      min-width: min(460px, 100%);
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 111, 202, 0.15);
    }

    .btn {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 10px 13px;
      cursor: pointer;
      color: #ffffff;
      background: var(--blue);
      font-weight: 900;
    }

    .btn:hover {
      background: #285ba4;
    }

    .btn.secondary {
      color: var(--ink);
      background: #ffffff;
      border: 1px solid var(--line);
    }

    .btn.secondary:hover {
      border-color: var(--blue);
      color: var(--blue);
      background: #f8fbff;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel.pad {
      padding: 16px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(200px, 280px) 1fr auto auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .status-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      min-height: 84px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 10px 24px rgba(23, 32, 51, 0.08);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .stat strong {
      display: block;
      margin-top: 7px;
      font-size: 2rem;
      line-height: 1;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, 0.75fr);
      gap: 18px;
      align-items: start;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }

    .game-card {
      display: grid;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 10px 24px rgba(23, 32, 51, 0.08);
    }

    .game-card:hover,
    .game-card.active {
      border-color: var(--blue);
      box-shadow: 0 14px 32px rgba(47, 111, 202, 0.18);
    }

    .game-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge.live {
      color: #ffffff;
      background: var(--red);
    }

    .badge.final {
      color: #ffffff;
      background: var(--navy);
    }

    .badge.scheduled {
      color: #241800;
      background: #f5d99c;
    }

    .team-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .team-name {
      min-width: 0;
    }

    .team-name strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: 1rem;
    }

    .team-name span {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .score {
      min-width: 38px;
      text-align: right;
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1;
    }

    .game-info {
      display: grid;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .game-info strong {
      color: var(--ink);
    }

    .detail {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 14px;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .detail-head {
      display: grid;
      gap: 8px;
    }

    .matchup {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }

    .match-team {
      display: grid;
      gap: 4px;
      justify-items: center;
      text-align: center;
      min-width: 0;
    }

    .match-team img {
      width: 54px;
      height: 54px;
      object-fit: contain;
    }

    .match-team strong {
      overflow-wrap: anywhere;
    }

    .match-score {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--navy);
    }

    .box-score-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .box-score {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
    }

    .box-score th,
    .box-score td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      white-space: nowrap;
    }

    .box-score th {
      color: var(--muted);
      background: #f7f9fc;
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .box-score td:first-child,
    .box-score th:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      min-width: 118px;
      text-align: left;
      background: #ffffff;
      font-weight: 900;
    }

    .box-score th:first-child {
      background: #f7f9fc;
    }

    .box-score tr:last-child td {
      border-bottom: 0;
    }

    .box-score .total-col {
      font-weight: 900;
      color: var(--navy);
      background: #f8fbff;
    }

    .diamond {
      display: grid;
      grid-template-columns: repeat(3, 16px);
      grid-template-rows: repeat(3, 16px);
      gap: 3px;
      justify-content: center;
      margin-top: 4px;
    }

    .base {
      width: 16px;
      height: 16px;
      border: 2px solid #c7d2df;
      background: #ffffff;
      transform: rotate(45deg);
    }

    .base.on {
      border-color: var(--gold);
      background: var(--gold);
    }

    .base.second {
      grid-column: 2;
      grid-row: 1;
    }

    .base.third {
      grid-column: 1;
      grid-row: 2;
    }

    .base.first {
      grid-column: 3;
      grid-row: 2;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mini {
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }

    .mini span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .mini strong {
      display: block;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .detail-section {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .odds {
      display: grid;
      gap: 8px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }

    .odds-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      font-weight: 900;
    }

    .odds-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #dce5ef;
    }

    .odds-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
    }

    .plays {
      display: grid;
      gap: 8px;
      max-height: 460px;
      overflow: auto;
      padding-right: 4px;
    }

    .play {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      line-height: 1.38;
    }

    .play span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .empty,
    .message {
      padding: 18px;
      color: var(--muted);
      line-height: 1.45;
      border: 1px dashed #c6d3e1;
      border-radius: 8px;
      background: #fbfcfe;
    }

    .loading {
      opacity: 0.72;
      pointer-events: none;
    }

    @media (max-width: 1040px) {
      header,
      main,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .detail {
        position: static;
      }
    }

    @media (max-width: 680px) {
      .app {
        padding: 10px;
      }

      header {
        gap: 12px;
        margin-bottom: 14px;
      }

      h1 {
        font-size: 2.2rem;
      }

      .subtitle {
        font-size: 0.94rem;
      }

      .controls,
      .status-strip,
      .mini-grid {
        grid-template-columns: 1fr;
      }

      .games-grid {
        grid-template-columns: 1fr;
      }

      .game-card {
        padding: 11px;
      }

      input,
      select,
      .btn {
        min-height: 48px;
        font-size: 16px;
      }

      .team-row {
        grid-template-columns: 38px minmax(0, 1fr) auto;
      }

      .logo {
        width: 38px;
        height: 38px;
      }

      .score {
        font-size: 1.7rem;
      }

      .matchup {
        grid-template-columns: 1fr;
      }

      .match-score {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Live MLB GameCenter</h1>
        <p class="subtitle">Follow today&apos;s MLB scoreboard with live innings, scores, probable pitchers, venues, base runners, and recent play-by-play.</p>
      </div>
      <div class="controls">
        <button class="btn secondary" id="prevDayBtn" type="button">Prev</button>
        <input id="gameDate" type="date" aria-label="Game date">
        <button class="btn secondary" id="nextDayBtn" type="button">Next</button>
      </div>
    </header>

    <section class="panel pad">
      <div class="toolbar">
        <div>
          <label for="teamFilter">Team filter</label>
          <select id="teamFilter">
            <option value="">All teams</option>
          </select>
        </div>
        <div>
          <label for="statusText">Status</label>
          <input id="statusText" type="text" value="Choose a date to load games." readonly>
        </div>
        <button class="btn secondary" id="todayBtn" type="button">Today</button>
        <button class="btn" id="refreshBtn" type="button">Refresh</button>
      </div>

      <div class="status-strip">
        <div class="stat"><span>Total Games</span><strong id="totalGames">0</strong></div>
        <div class="stat"><span>Live Now</span><strong id="liveGames">0</strong></div>
        <div class="stat"><span>Final</span><strong id="finalGames">0</strong></div>
        <div class="stat"><span>Scheduled</span><strong id="scheduledGames">0</strong></div>
      </div>
    </section>

    <main>
      <section class="panel pad">
        <div class="section-title">
          <h2>Scoreboard</h2>
        </div>
        <div class="games-grid" id="gamesGrid">
          <div class="empty">Loading games...</div>
        </div>
      </section>

      <aside class="detail">
        <section class="panel pad">
          <div class="detail-head">
            <h2>Game Details</h2>
            <div class="message" id="detailMessage">Select a game to see live details and recent plays.</div>
          </div>
          <div id="gameDetail"></div>
        </section>
      </aside>
    </main>
  </div>

  <script>
    const API_BASE = "https://statsapi.mlb.com/api/v1";
    const LIVE_BASE = "https://statsapi.mlb.com/api/v1.1/game";

    const state = {
      games: [],
      selectedGamePk: null,
      selectedFeed: null,
      selectedWinProbability: null,
      lastLoadedDate: "",
      refreshTimer: null
    };

    const gameDate = document.getElementById("gameDate");
    const prevDayBtn = document.getElementById("prevDayBtn");
    const nextDayBtn = document.getElementById("nextDayBtn");
    const todayBtn = document.getElementById("todayBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const teamFilter = document.getElementById("teamFilter");
    const statusText = document.getElementById("statusText");
    const totalGames = document.getElementById("totalGames");
    const liveGames = document.getElementById("liveGames");
    const finalGames = document.getElementById("finalGames");
    const scheduledGames = document.getElementById("scheduledGames");
    const gamesGrid = document.getElementById("gamesGrid");
    const detailMessage = document.getElementById("detailMessage");
    const gameDetail = document.getElementById("gameDetail");

    function todayIso() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().slice(0, 10);
    }

    function addDays(isoDate, amount) {
      const date = new Date(`${isoDate}T12:00:00`);
      date.setDate(date.getDate() + amount);
      return date.toISOString().slice(0, 10);
    }

    function displayTime(gameDateValue) {
      if (!gameDateValue) return "Time TBD";
      return new Date(gameDateValue).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function teamLogo(teamId) {
      return `https://www.mlbstatic.com/team-logos/${teamId}.svg`;
    }

    function gameState(game) {
      const detailed = game.status?.detailedState || "";
      const abstractState = game.status?.abstractGameState || "";
      if (abstractState === "Live") return "live";
      if (abstractState === "Final" || detailed.includes("Final") || detailed === "Game Over") return "final";
      return "scheduled";
    }

    function statusLabel(game) {
      const stateName = gameState(game);
      const linescore = game.linescore || {};
      if (stateName === "live") {
        const inning = linescore.currentInningOrdinal || "";
        const half = linescore.inningState || "";
        return `${half} ${inning}`.trim() || "Live";
      }
      if (stateName === "final") return game.status?.detailedState || "Final";
      return displayTime(game.gameDate);
    }

    function scoreFor(game, side) {
      return game.teams?.[side]?.score ?? "-";
    }

    function pitcherName(game, side) {
      return game.teams?.[side]?.probablePitcher?.fullName || "TBD";
    }

    function visibleGames() {
      const filter = teamFilter.value;
      if (!filter) return state.games;
      return state.games.filter((game) => {
        return String(game.teams.away.team.id) === filter || String(game.teams.home.team.id) === filter;
      });
    }

    function updateTeamFilter() {
      const current = teamFilter.value;
      const teams = new Map();
      state.games.forEach((game) => {
        teams.set(String(game.teams.away.team.id), game.teams.away.team.name);
        teams.set(String(game.teams.home.team.id), game.teams.home.team.name);
      });
      const options = ['<option value="">All teams</option>'];
      [...teams.entries()]
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([id, name]) => options.push(`<option value="${id}">${escapeHtml(name)}</option>`));
      teamFilter.innerHTML = options.join("");
      if ([...teams.keys()].includes(current)) teamFilter.value = current;
    }

    function renderStats() {
      const counts = state.games.reduce((acc, game) => {
        acc.total += 1;
        acc[gameState(game)] += 1;
        return acc;
      }, { total: 0, live: 0, final: 0, scheduled: 0 });
      totalGames.textContent = counts.total;
      liveGames.textContent = counts.live;
      finalGames.textContent = counts.final;
      scheduledGames.textContent = counts.scheduled;
    }

    function renderGames() {
      const games = visibleGames();
      if (games.length === 0) {
        gamesGrid.innerHTML = '<div class="empty">No games found for this date or team filter.</div>';
        return;
      }

      gamesGrid.innerHTML = games.map((game) => {
        const stateName = gameState(game);
        const away = game.teams.away.team;
        const home = game.teams.home.team;
        const venue = game.venue?.name || "Venue TBD";
        const active = game.gamePk === state.selectedGamePk ? " active" : "";
        return `
          <button class="game-card${active}" type="button" data-game-pk="${game.gamePk}">
            <div class="game-top">
              <span class="badge ${stateName}">${stateName === "live" ? "Live" : stateName === "final" ? "Final" : "Scheduled"}</span>
              <span class="badge">${escapeHtml(statusLabel(game))}</span>
            </div>
            <div class="team-row">
              <img class="logo" src="${teamLogo(away.id)}" alt="">
              <div class="team-name"><strong>${escapeHtml(away.name)}</strong><span>Probable starter: ${escapeHtml(pitcherName(game, "away"))}</span></div>
              <div class="score">${scoreFor(game, "away")}</div>
            </div>
            <div class="team-row">
              <img class="logo" src="${teamLogo(home.id)}" alt="">
              <div class="team-name"><strong>${escapeHtml(home.name)}</strong><span>Probable starter: ${escapeHtml(pitcherName(game, "home"))}</span></div>
              <div class="score">${scoreFor(game, "home")}</div>
            </div>
            <div class="game-info">
              <div><strong>Venue:</strong> ${escapeHtml(venue)}</div>
              <div><strong>Game status:</strong> ${escapeHtml(game.status?.detailedState || "-")}</div>
            </div>
          </button>
        `;
      }).join("");

      gamesGrid.querySelectorAll(".game-card").forEach((card) => {
        card.addEventListener("click", () => selectGame(Number(card.dataset.gamePk)));
      });
    }

    function baseIsOn(feed, baseName) {
      return Boolean(feed?.liveData?.linescore?.offense?.[baseName]);
    }

    function countText(feed) {
      const count = feed?.liveData?.linescore?.balls === undefined ? null : feed.liveData.linescore;
      if (!count) return "Count unavailable";
      return `${count.balls || 0}-${count.strikes || 0}, ${count.outs || 0} out${count.outs === 1 ? "" : "s"}`;
    }

    function recentPlays(feed) {
      const plays = feed?.liveData?.plays?.allPlays || [];
      return [...plays].reverse().slice(0, 8);
    }

    function scoringPlays(feed) {
      const plays = feed?.liveData?.plays?.allPlays || [];
      return plays.filter((play, index) => {
        if (play.about?.isScoringPlay) return true;
        const previous = plays[index - 1];
        const previousAway = previous?.result?.awayScore ?? 0;
        const previousHome = previous?.result?.homeScore ?? 0;
        return Number(play.result?.awayScore ?? previousAway) !== Number(previousAway)
          || Number(play.result?.homeScore ?? previousHome) !== Number(previousHome);
      }).reverse();
    }

    function personName(person) {
      return person?.fullName || person?.name || "Unavailable";
    }

    function currentBatter(feed) {
      return personName(feed?.liveData?.plays?.currentPlay?.matchup?.batter);
    }

    function currentPitcher(feed) {
      return personName(feed?.liveData?.plays?.currentPlay?.matchup?.pitcher);
    }

    function dueUp(feed) {
      const offense = feed?.liveData?.linescore?.offense || {};
      return [offense.batter, offense.onDeck, offense.inHole].filter(Boolean).map(personName);
    }

    function decisionName(game, feed, type) {
      const aliases = {
        winner: ["winner", "winningPitcher"],
        loser: ["loser", "losingPitcher"],
        save: ["save", "savePitcher"]
      }[type] || [type];
      const fromSchedule = aliases.map((key) => game.decisions?.[key]).find(Boolean);
      const fromFeed = aliases.map((key) => feed?.liveData?.decisions?.[key]).find(Boolean);
      return personName(fromSchedule || fromFeed);
    }

    function savePitcherName(game, feed) {
      return decisionName(game, feed, "save") === "Unavailable" ? "No save" : decisionName(game, feed, "save");
    }

    function latestWinOdds(game, feed, probabilityData) {
      const entries = Array.isArray(probabilityData)
        ? probabilityData
        : probabilityData?.data || probabilityData?.winProbability || probabilityData?.winProbabilities || [];
      const latest = [...entries].reverse().find((item) => {
        return item.homeTeamWinProbability !== undefined
          || item.homeWinProbability !== undefined
          || item.homeWinPercentage !== undefined;
      });
      const rawHome = latest?.homeTeamWinProbability ?? latest?.homeWinProbability ?? latest?.homeWinPercentage;
      if (rawHome !== undefined && rawHome !== null && Number.isFinite(Number(rawHome))) {
        const home = Number(rawHome) <= 1 ? Number(rawHome) * 100 : Number(rawHome);
        return { home: Math.max(0, Math.min(100, home)), away: Math.max(0, Math.min(100, 100 - home)) };
      }

      const linescore = feed?.liveData?.linescore || game.linescore;
      const awayRuns = Number(linescore?.teams?.away?.runs ?? game.teams?.away?.score ?? 0);
      const homeRuns = Number(linescore?.teams?.home?.runs ?? game.teams?.home?.score ?? 0);
      if (awayRuns === homeRuns) return { home: 50, away: 50, estimated: true };
      return awayRuns > homeRuns ? { home: 35, away: 65, estimated: true } : { home: 65, away: 35, estimated: true };
    }

    function recordText(game, side) {
      const record = game.teams?.[side]?.leagueRecord;
      if (!record) return "Record unavailable";
      return `${record.wins || 0}-${record.losses || 0}`;
    }

    function hitsErrorsText(game, feed) {
      const linescore = feed?.liveData?.linescore || game.linescore;
      const away = linescore?.teams?.away || {};
      const home = linescore?.teams?.home || {};
      return `${game.teams.away.team.abbreviation || "Away"} H/E: ${away.hits ?? "-"} / ${away.errors ?? "-"} | ${game.teams.home.team.abbreviation || "Home"} H/E: ${home.hits ?? "-"} / ${home.errors ?? "-"}`;
    }

    function inningRun(inning, side) {
      const value = inning?.[side]?.runs;
      return value === undefined || value === null ? "-" : value;
    }

    function boxScoreMarkup(game, feed) {
      const linescore = feed?.liveData?.linescore || game.linescore || {};
      const innings = linescore.innings || [];
      const inningCount = Math.max(innings.length, 9);
      const away = linescore.teams?.away || {};
      const home = linescore.teams?.home || {};
      const awayName = game.teams.away.team.abbreviation || game.teams.away.team.name;
      const homeName = game.teams.home.team.abbreviation || game.teams.home.team.name;
      const inningHeaders = Array.from({ length: inningCount }, (_, index) => `<th>${index + 1}</th>`).join("");
      const inningCells = (side) => Array.from({ length: inningCount }, (_, index) => `<td>${inningRun(innings[index], side)}</td>`).join("");
      const totalCell = (team, key, fallback) => team[key] ?? fallback ?? "-";

      return `
        <div class="box-score-wrap">
          <table class="box-score" aria-label="Box score">
            <thead>
              <tr>
                <th>Team</th>
                ${inningHeaders}
                <th class="total-col">R</th>
                <th class="total-col">H</th>
                <th class="total-col">E</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>${escapeHtml(awayName)}</td>
                ${inningCells("away")}
                <td class="total-col">${escapeHtml(totalCell(away, "runs", game.teams.away.score))}</td>
                <td class="total-col">${escapeHtml(totalCell(away, "hits"))}</td>
                <td class="total-col">${escapeHtml(totalCell(away, "errors"))}</td>
              </tr>
              <tr>
                <td>${escapeHtml(homeName)}</td>
                ${inningCells("home")}
                <td class="total-col">${escapeHtml(totalCell(home, "runs", game.teams.home.score))}</td>
                <td class="total-col">${escapeHtml(totalCell(home, "hits"))}</td>
                <td class="total-col">${escapeHtml(totalCell(home, "errors"))}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function weatherText(feed) {
      const weather = feed?.gameData?.weather;
      if (!weather) return "Weather unavailable";
      return [weather.temp ? `${weather.temp} deg` : "", weather.condition || "", weather.wind || ""].filter(Boolean).join(", ") || "Weather unavailable";
    }

    function attendanceText(feed) {
      const attendance = feed?.gameData?.gameInfo?.attendance;
      return attendance ? Number(attendance).toLocaleString() : "Attendance unavailable";
    }

    function firstPitchText(game, feed) {
      const firstPitch = feed?.gameData?.datetime?.firstPitchDate || game.gameDate;
      return firstPitch ? new Date(firstPitch).toLocaleString([], { hour: "numeric", minute: "2-digit", month: "short", day: "numeric" }) : "First pitch unavailable";
    }

    function gameNotesMarkup(game, feed) {
      return `
        <div class="mini-grid">
          <div class="mini"><span>First Pitch</span><strong>${escapeHtml(firstPitchText(game, feed))}</strong></div>
          <div class="mini"><span>Weather</span><strong>${escapeHtml(weatherText(feed))}</strong></div>
          <div class="mini"><span>Attendance</span><strong>${escapeHtml(attendanceText(feed))}</strong></div>
          <div class="mini"><span>Records</span><strong>${escapeHtml(recordText(game, "away"))} / ${escapeHtml(recordText(game, "home"))}</strong></div>
        </div>
      `;
    }

    function oddsMarkup(game, feed) {
      if (gameState(game) !== "live") return "";
      const away = game.teams.away.team;
      const home = game.teams.home.team;
      const odds = latestWinOdds(game, feed, state.selectedWinProbability);
      const note = odds.estimated ? "Estimated from score because live win probability was not available." : "Live win probability when provided by the MLB feed.";
      return `
        <div class="detail-section">
          <h2>Win Odds</h2>
          <div class="odds">
            <div class="odds-row"><span>${escapeHtml(away.name)}</span><strong>${Math.round(odds.away)}%</strong></div>
            <div class="odds-track"><div class="odds-fill" style="width:${Math.round(odds.away)}%"></div></div>
            <div class="odds-row"><span>${escapeHtml(home.name)}</span><strong>${Math.round(odds.home)}%</strong></div>
            <div class="odds-track"><div class="odds-fill" style="width:${Math.round(odds.home)}%;background:var(--red)"></div></div>
            <div class="game-info">${escapeHtml(note)}</div>
          </div>
        </div>
      `;
    }

    function liveInfoMarkup(game, feed) {
      if (gameState(game) !== "live") return "";
      const due = dueUp(feed);
      return `
        <div class="mini-grid">
          <div class="mini"><span>Pitching Now</span><strong>${escapeHtml(currentPitcher(feed))}</strong></div>
          <div class="mini"><span>Batting Now</span><strong>${escapeHtml(currentBatter(feed))}</strong></div>
          <div class="mini"><span>Due Up</span><strong>${escapeHtml(due.length ? due.join(" / ") : "Unavailable")}</strong></div>
          <div class="mini"><span>Hits / Errors</span><strong>${escapeHtml(hitsErrorsText(game, feed))}</strong></div>
        </div>
        ${oddsMarkup(game, feed)}
      `;
    }

    function finalInfoMarkup(game, feed) {
      if (gameState(game) !== "final") return "";
      return `
        <div class="mini-grid">
          <div class="mini"><span>Winning Pitcher</span><strong>${escapeHtml(decisionName(game, feed, "winner"))}</strong></div>
          <div class="mini"><span>Losing Pitcher</span><strong>${escapeHtml(decisionName(game, feed, "loser"))}</strong></div>
          <div class="mini"><span>Save</span><strong>${escapeHtml(savePitcherName(game, feed))}</strong></div>
          <div class="mini"><span>Hits / Errors</span><strong>${escapeHtml(hitsErrorsText(game, feed))}</strong></div>
        </div>
      `;
    }

    function probableStartersMarkup(game) {
      if (gameState(game) !== "scheduled") return "";
      return `
        <div class="detail-section">
          <h2>Probable Starters</h2>
          <div class="mini-grid">
            <div class="mini"><span>${escapeHtml(game.teams.away.team.name)}</span><strong>${escapeHtml(pitcherName(game, "away"))}</strong></div>
            <div class="mini"><span>${escapeHtml(game.teams.home.team.name)}</span><strong>${escapeHtml(pitcherName(game, "home"))}</strong></div>
          </div>
        </div>
      `;
    }

    function renderDetail() {
      const game = state.games.find((item) => item.gamePk === state.selectedGamePk);
      if (!game) {
        detailMessage.style.display = "block";
        gameDetail.innerHTML = "";
        return;
      }

      detailMessage.style.display = "none";
      const feed = state.selectedFeed;
      const away = game.teams.away.team;
      const home = game.teams.home.team;
      const plays = recentPlays(feed);
      const scoring = scoringPlays(feed);
      gameDetail.innerHTML = `
        <div class="matchup">
          <div class="match-team">
            <img src="${teamLogo(away.id)}" alt="">
            <strong>${escapeHtml(away.name)}</strong>
            <span>${escapeHtml(recordText(game, "away"))}</span>
          </div>
          <div class="match-score">${scoreFor(game, "away")} - ${scoreFor(game, "home")}</div>
          <div class="match-team">
            <img src="${teamLogo(home.id)}" alt="">
            <strong>${escapeHtml(home.name)}</strong>
            <span>${escapeHtml(recordText(game, "home"))}</span>
          </div>
        </div>
        <div class="detail-section">
          <h2>Box Score</h2>
          ${boxScoreMarkup(game, feed)}
        </div>
        ${probableStartersMarkup(game)}
        <div class="mini-grid">
          <div class="mini"><span>Status</span><strong>${escapeHtml(statusLabel(game))}</strong></div>
          <div class="mini"><span>Count</span><strong>${escapeHtml(countText(feed))}</strong></div>
          <div class="mini"><span>Venue</span><strong>${escapeHtml(game.venue?.name || "Venue TBD")}</strong></div>
          <div class="mini"><span>Runners</span>
            <div class="diamond" aria-label="Base runners">
              <span class="base second ${baseIsOn(feed, "second") ? "on" : ""}"></span>
              <span class="base third ${baseIsOn(feed, "third") ? "on" : ""}"></span>
              <span class="base first ${baseIsOn(feed, "first") ? "on" : ""}"></span>
            </div>
          </div>
        </div>
        ${liveInfoMarkup(game, feed)}
        ${finalInfoMarkup(game, feed)}
        <div class="detail-section">
          <h2>Game Notes</h2>
          ${gameNotesMarkup(game, feed)}
        </div>
        <div class="detail-section">
          <h2>Scoring Plays</h2>
          <div class="plays">
            ${scoring.length ? scoring.map((play) => `
              <div class="play">
                <span>${escapeHtml(play.about?.halfInning || "")} ${escapeHtml(play.about?.inning || "")} | ${escapeHtml(game.teams.away.team.abbreviation || "Away")} ${escapeHtml(play.result?.awayScore ?? "-")} - ${escapeHtml(game.teams.home.team.abbreviation || "Home")} ${escapeHtml(play.result?.homeScore ?? "-")}</span>
                ${escapeHtml(play.result?.description || play.result?.event || "Scoring play update unavailable.")}
              </div>
            `).join("") : '<div class="empty">No scoring plays available yet.</div>'}
          </div>
        </div>
        <div class="detail-section">
          <h2>Recent Plays</h2>
          <div class="plays">
            ${plays.length ? plays.map((play) => `
              <div class="play">
                <span>${escapeHtml(play.about?.halfInning || "")} ${escapeHtml(play.about?.inning || "")}</span>
                ${escapeHtml(play.result?.description || play.result?.event || "Play update unavailable.")}
              </div>
            `).join("") : '<div class="empty">Play-by-play will appear here once the game feed is available.</div>'}
          </div>
        </div>
      `;
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      return response.json();
    }

    async function selectGame(gamePk) {
      state.selectedGamePk = gamePk;
      state.selectedFeed = null;
      state.selectedWinProbability = null;
      renderGames();
      renderDetail();
      try {
        const [feedResult, probabilityResult] = await Promise.allSettled([
          fetchJson(`${LIVE_BASE}/${gamePk}/feed/live`),
          fetchJson(`${API_BASE}/game/${gamePk}/winProbability`)
        ]);
        state.selectedFeed = feedResult.status === "fulfilled" ? feedResult.value : null;
        state.selectedWinProbability = probabilityResult.status === "fulfilled" ? probabilityResult.value : null;
      } catch {
        state.selectedFeed = null;
        state.selectedWinProbability = null;
      }
      renderDetail();
    }

    async function loadGames() {
      const date = gameDate.value || todayIso();
      gameDate.value = date;
      state.lastLoadedDate = date;
      document.body.classList.add("loading");
      statusText.value = "Loading MLB games...";
      try {
        const url = `${API_BASE}/schedule?sportId=1&date=${date}&hydrate=team,linescore,probablePitcher,venue,decisions`;
        const data = await fetchJson(url);
        state.games = (data.dates || []).flatMap((day) => day.games || []);
        const selectedStillExists = state.games.some((game) => game.gamePk === state.selectedGamePk);
        if (!selectedStillExists) {
          const firstLive = state.games.find((game) => gameState(game) === "live");
          state.selectedGamePk = firstLive?.gamePk || state.games[0]?.gamePk || null;
          state.selectedFeed = null;
          state.selectedWinProbability = null;
        }
        updateTeamFilter();
        renderStats();
        renderGames();
        statusText.value = state.games.length ? `Loaded ${state.games.length} game${state.games.length === 1 ? "" : "s"}.` : "No MLB games found for this date.";
        if (state.selectedGamePk) await selectGame(state.selectedGamePk);
      } catch (error) {
        gamesGrid.innerHTML = '<div class="empty">Could not load games. Check your internet connection and try Refresh.</div>';
        detailMessage.style.display = "block";
        detailMessage.textContent = "Game details are unavailable until the scoreboard loads.";
        gameDetail.innerHTML = "";
        statusText.value = "Unable to load MLB games.";
      } finally {
        document.body.classList.remove("loading");
      }
    }

    function scheduleAutoRefresh() {
      if (state.refreshTimer) clearInterval(state.refreshTimer);
      state.refreshTimer = setInterval(() => {
        if (gameDate.value === todayIso() && state.games.some((game) => gameState(game) === "live")) {
          loadGames();
        }
      }, 60000);
    }

    prevDayBtn.addEventListener("click", () => {
      gameDate.value = addDays(gameDate.value || todayIso(), -1);
      loadGames();
    });

    nextDayBtn.addEventListener("click", () => {
      gameDate.value = addDays(gameDate.value || todayIso(), 1);
      loadGames();
    });

    todayBtn.addEventListener("click", () => {
      gameDate.value = todayIso();
      loadGames();
    });

    refreshBtn.addEventListener("click", loadGames);
    gameDate.addEventListener("change", loadGames);
    teamFilter.addEventListener("change", () => {
      renderGames();
      if (!visibleGames().some((game) => game.gamePk === state.selectedGamePk)) {
        state.selectedGamePk = visibleGames()[0]?.gamePk || null;
        state.selectedFeed = null;
        state.selectedWinProbability = null;
        if (state.selectedGamePk) selectGame(state.selectedGamePk);
        else renderDetail();
      }
    });

    gameDate.value = todayIso();
    loadGames().then(scheduleAutoRefresh);
  </script>
</body>
</html>
