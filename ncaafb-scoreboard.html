  <script>

    {id:1,status:'live',clock:'8:42 • 3rd',network:'FOX',conf:['Big Ten'],venue:'Michigan Stadium',city:'Ann Arbor, MI',away:{name:'Ohio State',abbr:'OSU',rank:2,record:'6-0',score:24,logo:194},home:{name:'Michigan',abbr:'MICH',rank:8,record:'5-1',score:20,logo:130},quarters:[[7,10,7,'–'],[3,10,7,'–']],situation:'Michigan ball • 2nd & 7 at MICH 41',drive:'Warren completes short right to Morgan for 9 yards and a first down.'},

    {id:7,status:'final',clock:'Final',network:'SECN',conf:['SEC'],venue:'Neyland Stadium',city:'Knoxville, TN',away:{name:'Oklahoma',abbr:'OU',rank:14,record:'4-2',score:21,logo:201},home:{name:'Tennessee',abbr:'TENN',rank:12,record:'5-1',score:34,logo:2633},quarters:[[7,7,0,7],[7,10,10,7]],situation:'Final',drive:'Tennessee seals the game with an interception at its own 18-yard line.'},
    {id:8,status:'upcoming',clock:'10:30 PM',network:'FS1',conf:['Big Ten'],venue:'Los Angeles Memorial Coliseum',city:'Los Angeles, CA',away:{name:'Nebraska',abbr:'NEB',rank:null,record:'4-2',score:null,logo:158},home:{name:'USC',abbr:'USC',rank:22,record:'4-2',score:null,logo:30},quarters:[['–','–','–','–'],['–','–','–','–']],situation:'Kickoff at 10:30 PM ET',drive:'USC hosts Nebraska under the lights at the Coliseum.'},
    {id:9,status:'final',clock:'Final/OT',network:'CBSSN',conf:['Mountain West'],venue:'Albertsons Stadium',city:'Boise, ID',away:{name:'Washington',abbr:'WASH',rank:null,record:'3-3',score:38,logo:264},home:{name:'Boise State',abbr:'BSU',rank:24,record:'5-1',score:41,logo:68},quarters:[[7,10,7,14],[14,7,7,10]],situation:'Final/OT',drive:'Boise State wins it with a 42-yard field goal in overtime.'}
  ];
  let games=[], teams=[], conf='all', ranked=false, live=false, selectedDate=new Date(), refreshTimer, viewMode='scoreboard', selectedTeam=null;
  const conferenceNames={'1':'ACC','4':'Big 12','5':'Big Ten','8':'SEC','17':'Mountain West','18':'Independent'};
  const img=t=>`<img src="${t.logoUrl||logo(t.logo)}" alt="${t.name} logo" onerror="this.style.display='none'">`;
  const dateKey=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const scoreValue=v=>v===undefined||v===null||v===''?null:(Number.isNaN(Number(v))?v:Number(v));
  function setSource(state,text){document.querySelector('#count').innerHTML=`<span class="source ${state}"><i class="source-dot"></i>${text}</span>`}
  function mapTeam(c){
    const rank=Number(c.curatedRank?.current); return {name:c.team?.shortDisplayName||c.team?.displayName||'TBD',abbr:c.team?.abbreviation||'TBD',rank:rank&&rank<=25?rank:null,record:c.records?.find(r=>r.type==='total')?.summary||c.records?.[0]?.summary||'—',score:scoreValue(c.score),logoUrl:c.team?.logo||c.team?.logos?.[0]?.href,conferenceId:String(c.team?.conferenceId||'')};
  }
  function mapEvent(e){
    const c=e.competitions?.[0]||{}, competitors=c.competitors||[], awayRaw=competitors.find(x=>x.homeAway==='away')||competitors[0]||{}, homeRaw=competitors.find(x=>x.homeAway==='home')||competitors[1]||{}, away=mapTeam(awayRaw), home=mapTeam(homeRaw);
    const state=e.status?.type?.state, completed=e.status?.type?.completed, status=completed?'final':state==='in'?'live':'upcoming';
    const q=t=>{const a=(t.linescores||[]).slice(0,4).map(x=>scoreValue(x.displayValue??x.value)??'–');while(a.length<4)a.push('–');return a};
    const confs=[conferenceNames[away.conferenceId],conferenceNames[home.conferenceId]].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
    const possession=c.situation?.possession===awayRaw.id?away.abbr:c.situation?.possession===homeRaw.id?home.abbr:'';
    const situation=c.situation?.downDistanceText?[possession,c.situation.downDistanceText].filter(Boolean).join(' ball • '):(e.status?.type?.detail||e.status?.type?.description||'Scheduled');
    const city=[c.venue?.address?.city,c.venue?.address?.state].filter(Boolean).join(', ')||'Location TBA';
    return {id:String(e.id),date:e.date?new Date(e.date):null,status,clock:e.status?.type?.shortDetail||e.status?.type?.detail||'Scheduled',network:c.broadcasts?.flatMap(b=>b.names||[])[0]||c.geoBroadcasts?.[0]?.media?.shortName||'ESPN',conf:confs.length?confs:['FBS'],venue:c.venue?.fullName||'Venue TBA',city,away,home,quarters:[q(awayRaw),q(homeRaw)],situation,drive:c.situation?.lastPlay?.text||c.notes?.[0]?.headline||e.status?.type?.description||'Game information will update as it becomes available.'};
  }
  async function loadScores({quiet=false}={}){
    viewMode='scoreboard'; selectedTeam=null; syncMode();
    clearTimeout(refreshTimer); if(!quiet){setSource('loading','Loading ESPN scores…');document.querySelector('#games').innerHTML='<div class="empty"><b>Loading the scoreboard…</b></div>'}
    try{
      const url=`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=${dateKey(selectedDate)}&groups=80&limit=200`;
      const response=await fetch(url); if(!response.ok)throw new Error(`ESPN returned ${response.status}`);
      const data=await response.json(); games=(data.events||[]).map(mapEvent); renderTicker(); render();
      setSource('',`${games.length} game${games.length===1?'':'s'} • ESPN live data`);
      if(games.some(g=>g.status==='live'))refreshTimer=setTimeout(()=>loadScores({quiet:true}),30000);
    }catch(error){
      console.warn('ESPN scoreboard unavailable:',error); games=sampleGames; renderTicker(); render(); setSource('error','ESPN unavailable • showing sample slate');
    }
  }
  function loadTeamDirectory(){
    const select=document.querySelector('#teamSelect');teams=(window.ESPN_TEAMS||[]).slice();select.innerHTML=`<option value="">Select a team to view its schedule…</option>${teams.map(t=>`<option value="${t.id}">${t.displayName}</option>`).join('')}`;
  }
  async function loadTeamSchedule(){
    const select=document.querySelector('#teamSelect'), team=teams.find(t=>String(t.id)===select.value);
    if(!team)return;
    let season=Number(document.querySelector('#season').value);clearTimeout(refreshTimer);viewMode='schedule';selectedTeam=team;syncMode();setSource('loading',`Loading ${team.shortDisplayName} schedule…`);document.querySelector('#games').innerHTML='<div class="empty"><b>Loading the season schedule…</b></div>';
    try{
      let data, requestedSeason=season;
      for(let attempt=0;attempt<3;attempt++){
        const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/${team.id}/schedule?season=${season}`);if(!r.ok)throw new Error(r.status);data=await r.json();
        if(data.events?.length||season<=2024)break;season--;
      }
      if(season!==requestedSeason){document.querySelector('#season').value=String(season);syncMode()}
      games=(data.events||[]).map(mapEvent).sort((a,b)=>(a.date||0)-(b.date||0));renderTicker();render();
      setSource(games.length?'':'error',games.length?`${games.length} games • ESPN ${season} schedule${season!==requestedSeason?` • ${requestedSeason} not yet available`:''}`:`No ${season} schedule is available for this team`);
    }catch(e){games=[];renderTicker();render();setSource('error','Unable to load this schedule • check your connection and try again')}
  }
  function syncMode(){
    const schedule=viewMode==='schedule';document.querySelector('#conference').hidden=schedule;document.querySelector('#top25').hidden=schedule;document.querySelector('#liveOnly').hidden=schedule;document.querySelector('#backScores').hidden=!schedule;document.querySelector('#filterLabel').textContent=schedule?`${selectedTeam?.displayName||'Team'} schedule`:'Filter games';
    document.querySelector('.date-controls').style.display=schedule?'none':'';if(schedule){document.querySelector('.eyebrow').textContent=`${document.querySelector('#season').value} • Full season`;document.querySelector('#dateTitle').textContent=selectedTeam?.displayName||'Team schedule'}else{document.querySelector('.eyebrow').textContent='FBS • Daily scoreboard'}
  }
  function filtered(){return viewMode==='schedule'?games:games.filter(g=>(conf==='all'||g.conf.includes(conf))&&(!ranked||(g.away.rank&&g.home.rank))&&(!live||g.status==='live'))}
  function cardDate(g){if(viewMode!=='schedule'||!g.date)return g.clock;const date=g.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),time=g.date.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});return `${date} • ${g.status==='upcoming'?time:g.clock}`}
  function render(){
    const shown=filtered();
    document.querySelector('#games').innerHTML=shown.length?shown.map(g=>`<article class="card" tabindex="0" role="button" aria-label="Open ${g.away.name} at ${g.home.name} game center" data-id="${g.id}"><div class="card-top"><span class="status ${g.status}">${cardDate(g)}</span><span class="network">${g.network}</span></div><div class="teams">${teamRow(g.away,g)}${teamRow(g.home,g)}</div><div class="venue">⌖ <span><b>${g.venue}</b> · ${g.city}</span></div></article>`).join(''):`<div class="empty"><b>${games.length?'No games match those filters.':viewMode==='schedule'?'No games are listed for this team and season.':'No FBS games scheduled for this date.'}</b><br><small>${games.length?'Try another conference or turn off a filter.':viewMode==='schedule'?'Try a different season.':'Use the arrows to browse another day.'}</small></div>`;
    document.querySelectorAll('.card').forEach(c=>{c.onclick=()=>openGame(+c.dataset.id);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGame(+c.dataset.id)}}});
  }
  function teamRow(t,g){let losing=g.status!=='upcoming'&&t.score<Math.max(g.away.score,g.home.score);return `<div class="team">${img(t)}<div><div class="team-name">${t.rank?`<span class="rank">${t.rank}</span>`:''}${t.name}</div><div class="record">${t.record}</div></div><div class="score ${losing?'loser':''}">${t.score??'–'}</div></div>`}
  function renderTicker(){document.querySelector('#ticker').innerHTML=games.slice(0,9).map(g=>`<div class="tick" role="button" tabindex="0" aria-label="${g.away.name} at ${g.home.name}, ${g.clock}" data-id="${g.id}">${img(g.away)}<b>${g.away.score??'–'}</b>${img(g.home)}<b>${g.home.score??'–'}</b><span>${g.clock}</span></div>`).join('');document.querySelectorAll('.tick').forEach(t=>{t.onclick=()=>openGame(t.dataset.id);t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGame(t.dataset.id)}}})}
  function openGame(id){const g=games.find(x=>String(x.id)===String(id));if(!g)return;const status=g.status==='live'?`<b>LIVE</b> · ${g.clock}`:g.clock;document.querySelector('#drawerContent').innerHTML=`<div class="drawer-head"><span>GameCenter</span><button class="close" aria-label="Close game center">×</button></div><div class="hero"><div class="game-meta">${g.network} · ${g.conf.join(' / ')}</div><div class="matchup"><div class="big-team">${img(g.away)}<h3>${g.away.rank?g.away.rank+' ':''}${g.away.name}</h3><small>${g.away.record}</small></div><div class="big-score">${g.away.score??'–'}<em>:</em>${g.home.score??'–'}</div><div class="big-team">${img(g.home)}<h3>${g.home.rank?g.home.rank+' ':''}${g.home.name}</h3><small>${g.home.record}</small></div></div><div class="situation">${status}<br>${g.situation}</div></div><div class="drawer-body"><h4 class="section-title">Game information</h4><div class="info-grid"><div class="info"><label>Venue</label><strong>${g.venue}</strong></div><div class="info"><label>Location</label><strong>${g.city}</strong></div><div class="info"><label>Broadcast</label><strong>${g.network}</strong></div><div class="info"><label>Conference</label><strong>${g.conf.join(' / ')}</strong></div></div><h4 class="section-title">Scoring by quarter</h4><table class="quarters"><thead><tr><th>Team</th><th>1</th><th>2</th><th>3</th><th>4</th><th>T</th></tr></thead><tbody><tr><td>${g.away.abbr}</td>${g.quarters[0].map(x=>`<td>${x}</td>`).join('')}<td>${g.away.score??'–'}</td></tr><tr><td>${g.home.abbr}</td>${g.quarters[1].map(x=>`<td>${x}</td>`).join('')}<td>${g.home.score??'–'}</td></tr></tbody></table><h4 class="section-title">${g.status==='upcoming'?'Game note':'Latest drive'}</h4><div class="drive"><b>${g.situation}</b><p>${g.drive}</p></div></div>`;document.querySelector('#scrim').classList.add('open');document.querySelector('#drawer').classList.add('open');document.querySelector('#drawer').setAttribute('aria-hidden','false');document.querySelector('.close').onclick=closeGame}
  function closeGame(){document.querySelector('#scrim').classList.remove('open');document.querySelector('#drawer').classList.remove('open');document.querySelector('#drawer').setAttribute('aria-hidden','true')}
  document.querySelector('#conference').onchange=e=>{conf=e.target.value;render()};document.querySelector('#top25').onclick=e=>{ranked=!ranked;e.currentTarget.classList.toggle('active',ranked);render()};document.querySelector('#liveOnly').onclick=e=>{live=!live;e.currentTarget.classList.toggle('active',live);render()};document.querySelector('#scrim').onclick=closeGame;document.onkeydown=e=>{if(e.key==='Escape')closeGame()};
  document.querySelector('#teamSelect').onchange=loadTeamSchedule;document.querySelector('#backScores').onclick=()=>{document.querySelector('#teamSelect').value='';updateDate()};document.querySelector('#season').onchange=()=>{if(viewMode==='schedule')loadTeamSchedule()};
  function localDateValue(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function updateDate(){document.querySelector('#dateTitle').textContent=selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});document.querySelector('#datePicker').value=localDateValue(selectedDate);loadScores()}
  document.querySelector('#prevDate').onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);updateDate()};document.querySelector('#nextDate').onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);updateDate()};document.querySelector('#today').onclick=()=>{selectedDate=new Date();updateDate()};document.querySelector('#datePicker').onchange=e=>{if(!e.target.value)return;const [year,month,day]=e.target.value.split('-').map(Number);selectedDate=new Date(year,month-1,day);updateDate()};
  loadTeamDirectory();updateDate();
  </script>
</body>
</html>
